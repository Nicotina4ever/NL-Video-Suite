[package]
name = "nl-video-suite"
version = "0.7.1"
edition = "2021"
description = "Local-first unified AI video production suite"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4", "v5", "serde"] }

# Development checks keep symbols/incremental caches from growing into gigabytes.
# Release settings and existing deliverables remain unchanged.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
